AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: PlanB authenticated event planning with signed, queued webhook delivery.
Parameters:
  AllowedOrigin:
    Type: String
    AllowedPattern: 'https://[^/\s]+'
    Description: Exact HTTPS frontend origin without a trailing slash.
  AuthDomainPrefix:
    Type: String
    AllowedPattern: '[a-z0-9][a-z0-9-]{2,50}[a-z0-9]'
    Description: Globally unique Cognito login domain prefix.
  WebhookUrl:
    Type: String
    Default: ''
    AllowedPattern: '(^$|https://[^\s]+)'
    Description: Optional operator-managed HTTPS destination. It receives approved schedules only after an organizer clicks Send.
  GeminiApiKey:
    Type: String
    Default: ''
    NoEcho: true
  AlarmTopicArn:
    Type: String
    Default: ''
    Description: Optional existing SNS topic for operational alarms.
Conditions:
  HasWebhook: !Not [!Equals [!Ref WebhookUrl, '']]
  HasAlarmTopic: !Not [!Equals [!Ref AlarmTopicArn, '']]
Globals:
  Function:
    Runtime: nodejs22.x
    Architectures: [arm64]
    MemorySize: 1024
    Timeout: 20
    Tracing: Active
Resources:
  Users:
    Type: AWS::Cognito::UserPool
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      UsernameAttributes: [email]
      AutoVerifiedAttributes: [email]
      AdminCreateUserConfig: { AllowAdminCreateUserOnly: true }
      Policies:
        PasswordPolicy: { MinimumLength: 12, RequireLowercase: true, RequireUppercase: true, RequireNumbers: true, RequireSymbols: true }
      MfaConfiguration: OPTIONAL
      EnabledMfas: [SOFTWARE_TOKEN_MFA]
      AccountRecoverySetting:
        RecoveryMechanisms: [{ Name: verified_email, Priority: 1 }]
  Scopes:
    Type: AWS::Cognito::UserPoolResourceServer
    Properties:
      UserPoolId: !Ref Users
      Identifier: planb
      Name: PlanB workspace
      Scopes: [{ ScopeName: write, ScopeDescription: Plan and publish approved schedules }]
  WebClient:
    Type: AWS::Cognito::UserPoolClient
    DependsOn: Scopes
    Properties:
      UserPoolId: !Ref Users
      GenerateSecret: false
      AllowedOAuthFlowsUserPoolClient: true
      AllowedOAuthFlows: [code]
      AllowedOAuthScopes: [openid, email, planb/write]
      SupportedIdentityProviders: [COGNITO]
      CallbackURLs: [!Sub '${AllowedOrigin}/', 'http://localhost:5173/', 'http://127.0.0.1:5173/']
      LogoutURLs: [!Sub '${AllowedOrigin}/', 'http://localhost:5173/', 'http://127.0.0.1:5173/']
      PreventUserExistenceErrors: ENABLED
      EnableTokenRevocation: true
      AccessTokenValidity: 15
      IdTokenValidity: 15
      RefreshTokenValidity: 1
      TokenValidityUnits: { AccessToken: minutes, IdToken: minutes, RefreshToken: days }
  AuthDomain:
    Type: AWS::Cognito::UserPoolDomain
    Properties: { Domain: !Ref AuthDomainPrefix, UserPoolId: !Ref Users }
  HttpApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      CorsConfiguration:
        AllowOrigins: [!Ref AllowedOrigin, 'http://localhost:5173', 'http://127.0.0.1:5173']
        AllowMethods: [GET, POST, OPTIONS]
        AllowHeaders: [content-type, authorization]
        MaxAge: 600
      DefaultRouteSettings: { ThrottlingRateLimit: 10, ThrottlingBurstLimit: 20 }
      AccessLogSettings:
        DestinationArn: !GetAtt ApiAccessLogs.Arn
        Format: '{"requestId":"$context.requestId","status":"$context.status","route":"$context.routeKey","latency":"$context.responseLatency"}'
      Auth:
        DefaultAuthorizer: CognitoJwt
        Authorizers:
          CognitoJwt:
            IdentitySource: '$request.header.Authorization'
            AuthorizationScopes: [planb/write]
            JwtConfiguration:
              issuer: !Sub 'https://cognito-idp.${AWS::Region}.amazonaws.com/${Users}'
              audience: [!Ref WebClient]
  ApiAccessLogs:
    Type: AWS::Logs::LogGroup
    Properties: { RetentionInDays: 30 }
  ApiLogs:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/aws/lambda/${AWS::StackName}-api'
      RetentionInDays: 30
  ApiFunction:
    Type: AWS::Serverless::Function
    DependsOn: ApiLogs
    Properties:
      FunctionName: !Sub '${AWS::StackName}-api'
      CodeUri: ../dist-server/
      Handler: handler.handler
      Environment:
        Variables:
          REQUIRE_AUTH: 'true'
          ALLOWED_ORIGIN: !Ref AllowedOrigin
          GEMINI_API_KEY: !Ref GeminiApiKey
          WEBHOOK_QUEUE_URL: !If [HasWebhook, !Ref DeliveryQueue, '']
      Policies:
        - !If
          - HasWebhook
          - SQSSendMessagePolicy: { QueueName: !GetAtt DeliveryQueue.QueueName }
          - !Ref AWS::NoValue
      Events:
        Health:
          Type: HttpApi
          Properties: { ApiId: !Ref HttpApi, Path: /health, Method: GET, Auth: { Authorizer: NONE } }
        Repair:
          Type: HttpApi
          Properties: { ApiId: !Ref HttpApi, Path: /repair, Method: POST }
        Validate:
          Type: HttpApi
          Properties: { ApiId: !Ref HttpApi, Path: /validate, Method: POST }
        Assist:
          Type: HttpApi
          Properties: { ApiId: !Ref HttpApi, Path: /assist, Method: POST }
        Publish:
          Type: HttpApi
          Properties: { ApiId: !Ref HttpApi, Path: /publish, Method: POST }
        Integrations:
          Type: HttpApi
          Properties: { ApiId: !Ref HttpApi, Path: /integrations, Method: GET }
  DeliverySecret:
    Type: AWS::SecretsManager::Secret
    Condition: HasWebhook
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      GenerateSecretString:
        SecretStringTemplate: '{}'
        GenerateStringKey: signingSecret
        PasswordLength: 48
        ExcludePunctuation: true
  FailedDeliveries:
    Type: AWS::SQS::Queue
    Condition: HasWebhook
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties: { FifoQueue: true, SqsManagedSseEnabled: true, MessageRetentionPeriod: 1209600 }
  DeliveryQueue:
    Type: AWS::SQS::Queue
    Condition: HasWebhook
    Properties:
      FifoQueue: true
      SqsManagedSseEnabled: true
      VisibilityTimeout: 180
      MessageRetentionPeriod: 345600
      RedrivePolicy: { deadLetterTargetArn: !GetAtt FailedDeliveries.Arn, maxReceiveCount: 5 }
  WorkerLogs:
    Type: AWS::Logs::LogGroup
    Condition: HasWebhook
    Properties:
      LogGroupName: !Sub '/aws/lambda/${AWS::StackName}-webhooks'
      RetentionInDays: 30
  WebhookWorker:
    Type: AWS::Serverless::Function
    Condition: HasWebhook
    DependsOn: WorkerLogs
    Properties:
      FunctionName: !Sub '${AWS::StackName}-webhooks'
      CodeUri: ../dist-server/
      Handler: webhook-worker.handler
      Timeout: 30
      MemorySize: 256
      Environment:
        Variables:
          WEBHOOK_URL: !Ref WebhookUrl
          WEBHOOK_SECRET_ARN: !Ref DeliverySecret
      Policies:
        - AWSSecretsManagerGetSecretValuePolicy: { SecretArn: !Ref DeliverySecret }
      Events:
        Delivery:
          Type: SQS
          Properties:
            Queue: !GetAtt DeliveryQueue.Arn
            BatchSize: 1
            FunctionResponseTypes: [ReportBatchItemFailures]
            ScalingConfig: { MaximumConcurrency: 2 }
  FailedDeliveryAlarm:
    Type: AWS::CloudWatch::Alarm
    Condition: HasWebhook
    Properties:
      AlarmDescription: Webhook deliveries need operator review and redrive.
      Namespace: AWS/SQS
      MetricName: ApproximateNumberOfMessagesVisible
      Dimensions: [{ Name: QueueName, Value: !GetAtt FailedDeliveries.QueueName }]
      Statistic: Maximum
      Period: 60
      EvaluationPeriods: 1
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions: !If [HasAlarmTopic, [!Ref AlarmTopicArn], []]
  ApiErrorAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions: [{ Name: FunctionName, Value: !Ref ApiFunction }]
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 3
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: !If [HasAlarmTopic, [!Ref AlarmTopicArn], []]
Outputs:
  ApiUrl:
    Value: !Sub 'https://${HttpApi}.execute-api.${AWS::Region}.${AWS::URLSuffix}'
  AuthAuthority:
    Value: !Sub 'https://cognito-idp.${AWS::Region}.amazonaws.com/${Users}'
  AuthClientId:
    Value: !Ref WebClient
  AuthDomain:
    Value: !Sub 'https://${AuthDomainPrefix}.auth.${AWS::Region}.amazoncognito.com'
  UserPoolId:
    Value: !Ref Users
  WebhookSecretArn:
    Condition: HasWebhook
    Value: !Ref DeliverySecret
  FailedDeliveryQueueUrl:
    Condition: HasWebhook
    Value: !Ref FailedDeliveries


